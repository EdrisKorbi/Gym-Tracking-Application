<div class="dashboard-container">

    <!-- Top Navigation Bar -->
    <nav class="top-nav cascade-item delay-1">
        <div class="brand">
            <div class="logo neu-raised"></div>
            <h2>FitnessApp</h2>
        </div>

        <div class="nav-actions">
            <!-- Theme Toggle Button -->
            <button class="neu-btn icon-btn" (click)="toggleTheme()" aria-label="Toggle Theme">
                @if (isDarkMode()) {
                <span>☀️</span>
                } @else {
                <span>🌙</span>
                }
            </button>

            <!-- Logout Button -->
            <button class="neu-btn" (click)="logout()">Sign Out</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="dashboard-content">

        <!-- Welcome Card -->
        <div class="welcome-card neu-raised neu-extrude cascade-item delay-2">
            <h1>Welcome back, {{ currentUser()?.firstName }}!</h1>
            <p>Ready to crush your goals today?</p>

            <!-- Admin Only Button -->
            @if (currentUser()?.role === 'ADMIN') {
            <button class="neu-btn-primary mt-4">Open Admin Portal</button>
            }
        </div>

        <!-- Fitness Statistics Grid -->
        <div class="stats-grid cascade-item delay-3">

            <!-- Concave (Inset) Data Displays -->
            <div class="stat-card neu-inset">
                <h3>Total Workouts</h3>
                <p class="stat-value">0</p>
            </div>

            <div class="stat-card neu-inset">
                <h3>Active Time</h3>
                <p class="stat-value">0 <span class="unit">min</span></p>
            </div>

            <div class="stat-card neu-inset">
                <h3>Current Streak</h3>
                <p class="stat-value">0 <span class="unit">days</span></p>
            </div>

        </div>
    </main>

</div>
