      \    pm.expect(jsonData.data).to.not.be.undefined;\r

      \    \r

      \    // 3. Verify the core user fields exist (resilient against variable drift)\r

      \    pm.expect(jsonData.data.id).to.be.a(\"string\");\r

      \    pm.expect(jsonData.data.email).to.include(\"@gym.com\");\r

      \    pm.expect(jsonData.data.role).to.eql(\"USER\");\r

      });"
