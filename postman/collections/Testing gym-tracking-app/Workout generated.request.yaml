$kind: http-request
description: ""
url: "{{base_url}}/api/v1/workouts"
method: GET
auth:
  type: inherit
  credentials:
    id: 0d82e42f-a3e7-484d-b31d-248092b6a7db
scripts:
  - type: afterResponse
    code: "// Test that the request was successful\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // Extract the first workout's ID using the new 'content' wrapper\r

      let jsonData = pm.response.json();\r

      if (jsonData.data.content && jsonData.data.content.length > 0) {\r

      \    pm.environment.set(\"workoutId\", jsonData.data.content[0].id);\r

      }"
    language: text/javascript
order: 5000
