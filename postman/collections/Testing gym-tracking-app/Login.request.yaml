$kind: http-request
url: "{{base_url}}/api/v1/users/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"{{workflow_email}}\",\r

    \    \"password\": \"{{workflow_password}}\"\r

    }"
auth:
  type: bearer
scripts:
  - type: afterResponse
    code: "pm.test(\"2. Login: Issues JWT and Refresh Token\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    let jsonData = pm.response.json();\r

      \    pm.expect(jsonData.data.token).to.be.a(\"string\");\r

      \    pm.expect(jsonData.data.refreshToken).to.be.a(\"string\");\r

      \r

      \    pm.environment.set(\"auth_token\", jsonData.data.token);\r

      \    pm.environment.set(\"refreshToken\", jsonData.data.refreshToken);\r

      });"
    language: text/javascript
order: 1783
