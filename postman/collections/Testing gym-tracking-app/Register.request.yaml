$kind: http-request
url: "{{base_url}}/api/v1/users/register"
method: POST
body:
  type: json
  content: "{\r

    \    \"firstName\": \"Workflow\",\r

    \    \"lastName\": \"Runner\",\r

    \    \"email\": \"{{workflow_email}}\",\r

    \    \"password\": \"{{workflow_password}}\"\r

    }"
scripts:
  - type: beforeRequest
    code: "let uniqueEmail = \"e2e_user_\" + Date.now() + \"@gym.com\";\r

      pm.environment.set(\"workflow_email\", uniqueEmail);\r

      pm.environment.set(\"workflow_password\", \"SecurePass123!\");"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"1. Register: Returns 201 Created\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([200, 201]);\r

      \    let jsonData = pm.response.json();\r

      \    pm.expect(jsonData.data.id).to.not.be.undefined;\r

      \    pm.environment.set(\"user_id\", jsonData.data.id);\r

      });"
    language: text/javascript
order: 1636
