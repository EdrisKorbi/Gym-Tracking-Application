$kind: http-request
description: ""
url: "{{base_url}}/api/v1/programs/{{program_id}}/generate"
method: POST
body:
  type: json
  content: "{\r

    \    \"startDate\": \"{{todayDate}}\",\r

    \    \"preferredDays\": [\"MONDAY\", \"WEDNESDAY\", \"FRIDAY\"]\r

    }"
auth:
  type: inherit
  credentials:
    id: 0d82e42f-a3e7-484d-b31d-248092b6a7db
scripts:
  - type: afterResponse
    code: "pm.test(\"Workouts generated successfully\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Response contains success message\", function () {\r

      \    let jsonData = pm.response.json();\r

      \    pm.expect(jsonData.message).to.include(\"Successfully scheduled\");\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "// Get today's date and format it as YYYY-MM-DD\r

      const today = new Date();\r

      const formattedDate = today.toISOString().split('T')[0];\r

      \r

      // Save it as a variable for the Body to use\r

      pm.environment.set(\"todayDate\", formattedDate);"
    language: text/javascript
order: 4000
