$kind: http-request
url: "{{base_url}}/api/v1/programs/templates?page=0&size=10"
method: GET
queryParams:
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: "pm.test(\"8. Templates: Fetch list and save template_id\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    let jsonData = pm.response.json();\r

      \    if (jsonData.data && jsonData.data.content && jsonData.data.content.length > 0) {\r

      \        pm.environment.set(\"template_id\", jsonData.data.content[0].id);\r

      \    } else {\r

      \        // Fallback fake UUID if database is empty so the next step doesn't crash\r

      \        pm.environment.set(\"template_id\", \"00000000-0000-0000-0000-000000000001\");\r

      \    }\r

      });"
    language: text/javascript
