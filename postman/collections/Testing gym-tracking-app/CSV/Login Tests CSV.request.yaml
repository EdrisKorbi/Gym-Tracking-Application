$kind: http-request
url: "{{base_url}}/api/v1/users/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"{{email}}\",\r

    \    \"password\": \"{{password}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "// 1. Retrieve expected status and scenario name from the active CSV
      row\r

      let expectedStatus =
      parseInt(pm.iterationData.get(\"expected_status\"));\r

      let scenario = pm.iterationData.get(\"scenario\");\r

      \r

      // 2. Test the dynamic status code\r

      pm.test(\"Scenario: \" + scenario, function () {\r

      \    pm.response.to.have.status(expectedStatus);\r

      });\r

      \r

      // 3. ONLY extract tokens if it's the successful login scenario (200 OK)\r

      if (pm.response.code === 200) {\r

      \    let jsonData = pm.response.json();\r

      \    if (jsonData.success && jsonData.data) {\r

      \        pm.environment.set(\"auth_token\", jsonData.data.token);\r

      \        pm.environment.set(\"refreshToken\",
      jsonData.data.refreshToken);\r

      \        console.log(\"Tokens updated for: \" +
      pm.iterationData.get(\"email\"));\r

      \    }\r

      }"
    language: text/javascript
order: 1000
