name: Enterprise Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-backend:
    runs-on: ubuntu-latest

    steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Set up JDK 25
            uses: actions/setup-java@v5
            with:
              java-version: '25'
              distribution: 'temurin'
              cache: 'maven'

          - name: Run Unit & Testcontainers E2E HTTP Suite
            working-directory: ./backend
            run: mvn clean test